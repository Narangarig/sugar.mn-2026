<!--
  Site header — loaded into <div data-include="header"> on every page by assets/main.js.
  Placeholders: {{root}} = path to site root, {{facebook}} {{x}} {{youtube}} = URLs from site.json.
  The category list is built from site.json using the <template> inside #category-menu.
-->
<header class="bg-primary text-white">
  <div class="container mx-auto px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-3">
    <a href="{{root}}" aria-label="Sugar.mn" class="shrink-0"><img src="{{root}}assets/logo.svg" alt="Sugar.mn" width="110" height="39" class="h-8 w-auto md:h-10"></a>

    <!-- Search: full width on its own row on mobile, inline on md+ -->
    <form action="{{root}}search/" method="get" role="search" class="order-last md:order-none w-full md:w-auto md:flex-1 md:max-w-md md:mx-auto flex gap-2">
      <label for="q" class="sr-only">Хайх</label>
      <input id="q" name="q" type="search" placeholder="Хайх..." class="min-w-0 flex-1 px-3 py-1.5 rounded text-gray-900">
      <button type="submit" class="shrink-0 px-3 py-1.5 rounded bg-gray-900 text-sm">Хайх</button>
    </form>

    <!-- Social links -->
    <ul class="ml-auto md:ml-0 flex items-center gap-4">
      <li>
        <a href="{{facebook}}" target="_blank" rel="noopener me" aria-label="Facebook" title="Facebook">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
      </li>
      <li>
        <a href="{{x}}" target="_blank" rel="noopener me" aria-label="X" title="X">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
        </a>
      </li>
      <li>
        <a href="{{youtube}}" target="_blank" rel="noopener me" aria-label="YouTube" title="YouTube">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </li>
    </ul>
  </div>

  <!-- Categories menu: dropdown on mobile (button toggles #category-menu), horizontal on md+ -->
  <nav class="site-nav container mx-auto px-4" aria-label="Ангилал">
    <button type="button" data-menu-toggle aria-controls="category-menu" aria-expanded="false"
      class="md:hidden w-full flex items-center justify-between py-2 text-sm font-medium">
      <span data-menu-label>Ангилал</span>
      <svg data-menu-icon-open class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
      <svg data-menu-icon-close class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
    </button>
    <ul id="category-menu" class="hidden md:flex flex-col md:flex-row md:flex-wrap md:gap-x-4 md:gap-y-1 pb-2 md:py-2 text-sm divide-y divide-white/20 md:divide-y-0">
      <!-- One <li> per category in site.json. Placeholders: {{url}} {{slug}} {{name}} -->
      <template>
        <li><a href="{{url}}" data-cat="{{slug}}" class="block py-2 md:py-0">{{name}}</a></li>
      </template>
    </ul>
  </nav>
</header>
